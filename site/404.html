<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self';" />
  <title>Redirecionando... | HOKAGE22B</title>
  <link rel="icon" href="/assets/img/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/brand/hokage22b-logo.svg" />
  <script>
    (function () {
      var path = window.location.pathname || '';
      var clean = path.replace(/^\/+|\/+$/g, '');
      var segments = clean.split('/').filter(Boolean);
      var first = segments[0] || '';
      var second = segments[1] || '';

      // Mapa declarativo de aliases legados e rotas curtas (sem arquivos HTML duplicados)
      var REDIRECT_MAP = {
        'alem-do-clique': '/um.html',
        'alem-do-clique.html': '/um.html',
        'desenvolvedores': '/construir.html',
        'desenvolvedores.html': '/construir.html',
        'explorar': '/pioneiro.html?explorar=1',
        'explorar.html': '/pioneiro.html?explorar=1',
        'diretorio': '/pioneiro.html?explorar=1',
        'diretorio.html': '/pioneiro.html?explorar=1',
        'empresas': '/business.html',
        'empresas.html': '/business.html'
      };
      if (segments.length === 1 && REDIRECT_MAP[first.toLowerCase()]) {
        window.location.replace(REDIRECT_MAP[first.toLowerCase()] + window.location.search + window.location.hash);
        return;
      }

      // Páginas conhecidas da raiz do portal
      var knownRootPages = ['zero', 'um', 'vender', 'mural', 'pioneiro', 'construir', 'business', 'hackathon', 'obrigado', 'admin', 'ferramentas', 'monte', 'jornada', 'ebooks', 'sobre'];
      if (segments.length === 1 && knownRootPages.indexOf(first.toLowerCase()) !== -1) {
        window.location.replace('/' + first.toLowerCase() + '.html' + window.location.search + window.location.hash);
        return;
      }

      function appendSearch(baseUrl) {
        var extra = (window.location.search || '').replace(/^\?/, '');
        if (!extra) return baseUrl;
        return baseUrl + (baseUrl.indexOf('?') === -1 ? '?' : '&') + extra;
      }

      // Atalhos especiais para o Simulador Interativo
      if (first.toLowerCase() === 'simulador' || first.toLowerCase() === 'teste') {
        window.location.replace(appendSearch('/pioneiro.html?teste=1') + window.location.hash);
        return;
      }

      // Caso 1: hokage22b.com/@usuario ou hokage22b.com/@usuario/
      if (first.startsWith('@')) {
        window.location.replace(appendSearch('/pioneiro.html?u=' + encodeURIComponent(first)) + window.location.hash);
        return;
      }

      // Caso 2: hokage22b.com/pioneiro/@usuario ou hokage22b.com/pioneiro/usuario
      if (first.toLowerCase() === 'pioneiro' && second) {
        var u = second.startsWith('@') ? second : ('@' + second);
        window.location.replace(appendSearch('/pioneiro.html?u=' + encodeURIComponent(u)) + window.location.hash);
        return;
      }

      // Caso 3: hokage22b.com/usuario (ex: hokage22b.com/hokage22b)
      // Qualquer slug único que não contenha ponto e não seja página do sistema
      if (segments.length === 1 && first && first.indexOf('.') === -1 && knownRootPages.indexOf(first.toLowerCase()) === -1) {
        window.location.replace(appendSearch('/pioneiro.html?u=' + encodeURIComponent('@' + first)) + window.location.hash);
        return;
      }

      // Caso não identificado, envia para a página inicial preservando parâmetros (?ref=, etc.)
      window.location.replace(appendSearch('/index.html') + window.location.hash);
    })();
  </script>
</head>
<body style="background:#09090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px">
  <div>
    <div style="font-size:2.8rem;color:#8b5cf6;margin-bottom:12px">✦</div>
    <h1 style="font-size:1.3rem;font-weight:700;margin:0 0 8px">Carregando Passaporte Web3...</h1>
    <p style="color:#94a3b8;font-size:0.9rem">Conectando ao perfil do pioneiro na Pi Network.</p>
  </div>
</body>
</html>
