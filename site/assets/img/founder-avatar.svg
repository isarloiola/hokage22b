<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="65%" stop-color="#180429"/>
      <stop offset="100%" stop-color="#0a0113"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="url(#violet)" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6"/>
  <!-- Central Glowing Pi Symbol -->
  <g filter="url(#glow)">
    <text x="128" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="104" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle">π</text>
  </g>
  <!-- Founder Badge Banner -->
  <rect x="58" y="196" width="140" height="26" rx="13" fill="#1e1035" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="128" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">HOKAGE22B</text>
  <!-- Sparkles -->
  <text x="70" y="80" font-size="18" fill="#fbbf24" opacity="0.85">✦</text>
  <text x="186" y="80" font-size="18" fill="#c4b5fd" opacity="0.85">✦</text>
</svg>
