          var params = new URLSearchParams(window.location.search || '');
          var qStep = params.get('step');
          if (qStep === 'ready') {
            var u = getLoggedUserSnapshot();
            state.step = (u && u.username) ? 5 : 4;
          }
        } catch (_) {}
      }

      function updateHeaderChrome() {
        var pct = Math.min(100, Math.max(20, state.step * 20));
        if (stepPill) stepPill.textContent = 'Passo ' + state.step + ' de 5';
        if (stepPct) stepPct.textContent = pct + '%';
        if (progressFill) progressFill.style.width = pct + '%';
        if (backBtn) backBtn.style.display = state.step > 1 ? 'inline-flex' : 'none';
      }

      function animateStage() {
        stageEl.classList.remove('j-stage');
        void stageEl.offsetWidth;
        stageEl.classList.add('j-stage');
      }

      function goToStep(nextStep) {
        state.step = Math.min(5, Math.max(1, nextStep));
        persistState();
        renderCurrentStep();
      }

      function renderQuestionStep(qIndex) {
        var q = engine.QUESTIONS[qIndex];
        if (!q) {
          goToStep(3);
          return;
        }
        var currentVal = state.answers[q.id] || '';
        var choicesHtml = q.options.map(function (opt) {
          var selectedCls = opt.value === currentVal ? ' is-selected' : '';
          return (
            '<button type="button" class="j-choice-btn' + selectedCls + '" data-val="' + esc(opt.value) + '">' +
              '<span class="j-choice-icon">' + opt.icon + '</span>' +
              '<span>' +
                '<span class="j-choice-label">' + esc(opt.label) + '</span>' +
                '<span class="j-choice-desc">' + esc(opt.desc) + '</span>' +
              '</span>' +
            '</button>'
          );
        }).join('');

        stageEl.innerHTML =
          '<h1 class="j-title">' + esc(q.title) + '</h1>' +
          '<p class="j-subtitle">' + esc(q.subtitle) + '</p>' +
          '<div class="j-choices">' + choicesHtml + '</div>';

        stageEl.querySelectorAll('.j-choice-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.answers[q.id] = btn.getAttribute('data-val');
            goToStep(state.step + 1);
          });
        });
      }

      function renderEducationStep() {
        var edu = engine.buildEducationStep(state.answers);
        var pillarsHtml = edu.pillars.map(function (p, idx) {
          var cls = idx === 1 ? 'j-pillar-card j-pillar-card--id' : 'j-pillar-card';
          return (
            '<div class="' + cls + '">' +
              '<span class="j-choice-icon">' + p.icon + '</span>' +
              '<div>' +
                '<span class="j-pillar-badge">' + esc(p.badge) + '</span>' +
                '<h2 class="j-pillar-title">' + esc(p.title) + '</h2>' +
                '<p class="j-pillar-desc">' + esc(p.desc) + '</p>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        stageEl.innerHTML =
          '<h1 class="j-title">' + esc(edu.title) + '</h1>' +
          '<p class="j-subtitle">' + esc(edu.subtitle) + '</p>' +
          '<div class="j-pillars">' + pillarsHtml + '</div>' +
          '<div class="j-highlight-box">💡 ' + esc(edu.highlight) + '</div>' +
          '<button type="button" id="j-edu-next" class="j-cta-primary">' + esc(edu.ctaLabel) + '</button>';

        document.getElementById('j-edu-next').addEventListener('click', function () {
          goToStep(4);
        });
      }

      function showBoxFeedback(elId, msg, kind) {
        var box = document.getElementById(elId);
        if (!box) return;
        box.className = 'j-feedback is-' + (kind || 'info');
        box.textContent = msg;
      }

      function renderStep4Auth() {
        var user = getLoggedUserSnapshot();
        var inPi = isPiBrowserEnv();

        // Caso A: Já está logado e já tem @usuario
        if (user && user.username) {
          var cleanHandle = '@' + String(user.username).replace(/^@+/, '');
          stageEl.innerHTML =
            '<div class="j-status-pill j-status-pill--ok">✓ Conectado como ' + esc(cleanHandle) + '</div>' +
            '<h1 class="j-title">Seu acesso já está ativo!</h1>' +
            '<p class="j-subtitle">Você já está autenticado e com seu Passaporte (futuro Hokage ID) vinculado. Clique abaixo para escolher sua entrada.</p>' +
            '<button type="button" id="j-auth-continue" class="j-cta-primary">Continuar pronto para negociar →</button>';

          document.getElementById('j-auth-continue').addEventListener('click', function () {
            goToStep(5);
          });
          return;
        }

        // Caso B: Já logou via Web2 (Google / E-mail), mas ainda falta escolher @usuario
        if (user && user.authType === 'web2' && !inPi) {
          var emailLabel = user.email ? ('Conta conectada (' + user.email + ')') : 'Conta Web conectada';
          stageEl.innerHTML =
            '<div class="j-status-pill j-status-pill--ok">✓ ' + esc(emailLabel) + '</div>' +
            '<h1 class="j-title">Escolha seu @usuário do Passaporte</h1>' +
            '<p class="j-subtitle">Esse será seu identificador público na Vila e no futuro <strong>Hokage ID</strong> (letras minúsculas, números e _).</p>' +
            '<form id="j-handle-form" class="j-auth-box">' +
              '<label for="j-handle-input" style="display:block;font-size:0.78rem;font-weight:700;color:#d4d4d8;margin-bottom:6px">Seu @usuário único:</label>' +
              '<input id="j-handle-input" class="j-input" type="text" maxlength="24" autocomplete="username" placeholder="ex: maria_silva" required />' +
              '<div id="j-handle-feedback" class="j-feedback"></div>' +
              '<button type="submit" id="j-handle-submit" class="j-cta-primary" style="margin-top:12px">✓ Ativar meu @usuário e continuar →</button>' +
            '</form>' +
            '<div class="j-skip-row">' +
              '<button type="button" id="j-handle-skip" class="j-ghost-btn">Definir @usuário depois →</button>' +
            '</div>';

          var handleForm = document.getElementById('j-handle-form');
          var handleInput = document.getElementById('j-handle-input');
          var handleSubmit = document.getElementById('j-handle-submit');

          handleForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var rawVal = (handleInput.value || '').trim().replace(/^@+/, '').toLowerCase();
            if (!/^[a-z0-9_]{3,24}$/.test(rawVal)) {
              showBoxFeedback('j-handle-feedback', 'Use de 3 a 24 caracteres: apenas letras minúsculas, números e _ (sem espaços).', 'error');
              handleInput.focus();
              return;
            }
            if (!window.IsarDB || typeof window.IsarDB.savePioneerProfile !== 'function') {
              showBoxFeedback('j-handle-feedback', 'Serviço de perfil indisponível no momento. Tente definir depois.', 'error');
              return;
            }
            handleSubmit.disabled = true;
            handleSubmit.textContent = '⏳ Ativando seu @' + rawVal + '...';
            try {
              var saved = await window.IsarDB.savePioneerProfile('@' + rawVal, {});
              var finalUsername = (saved && saved.username) ? saved.username : ('@' + rawVal);
              var savedEmail = '';
              try { savedEmail = localStorage.getItem('hokage_web2_session_email') || user.email || ''; } catch (_) {}
              var updatedUser = {
                username: finalUsername,
                uid: (saved && saved.uid) || user.uid || '',
                authType: (saved && saved.is_pi_verified) ? 'hybrid' : 'web2',
                is_pi_verified: Boolean(saved && saved.is_pi_verified),
                email: savedEmail
              };
              try {
                localStorage.setItem('hokage_pi_user', JSON.stringify(updatedUser));
                localStorage.setItem('isar_pi_user', JSON.stringify(updatedUser));
              } catch (_) {}
              if (window.HokagePi && typeof window.HokagePi.updateAuthUi === 'function') {
                window.HokagePi.updateAuthUi(updatedUser);
              }
              goToStep(5);
            } catch (err) {
              handleSubmit.disabled = false;
              handleSubmit.textContent = '✓ Ativar meu @usuário e continuar →';
              showBoxFeedback('j-handle-feedback', (err && err.message) ? err.message : 'Não foi possível salvar este @usuário. Tente outro.', 'error');
            }
          });

          document.getElementById('j-handle-skip').addEventListener('click', function () {
            goToStep(5);
          });
          return;
        }

        // Caso C1: Dentro do Pi Browser (100% Pi-Native — NUNCA carrega Google/Web2)
        if (inPi) {
          stageEl.innerHTML =
            '<h1 class="j-title">Conecte sua conta Pi Network</h1>' +
            '<p class="j-subtitle">No Pi Browser seu login é oficial em 1 toque e já ativa seu @usuário como Passaporte (futuro Hokage ID).</p>' +
            '<div class="j-auth-box">' +
              '<button type="button" id="j-pi-login-btn" class="j-cta-pi">⚡ Conectar com minha conta Pi</button>' +
              '<div id="j-pi-feedback" class="j-feedback"></div>' +
            '</div>' +
            '<div class="j-skip-row">' +
              '<button type="button" id="j-auth-skip" class="j-ghost-btn">Continuar sem conectar por enquanto →</button>' +
            '</div>';

          var piBtn = document.getElementById('j-pi-login-btn');
          piBtn.addEventListener('click', async function () {
            if (!window.HokagePi || typeof window.HokagePi.loginWithPi !== 'function') {
              showBoxFeedback('j-pi-feedback', 'SDK do Pi Browser indisponível nesta aba.', 'error');
              return;
            }
            piBtn.disabled = true;
            piBtn.textContent = '⏳ Aguardando autorização Pi...';
            try {
              var loggedPi = await window.HokagePi.loginWithPi();
              if (loggedPi && loggedPi.username) {
                goToStep(5);
              } else {
                piBtn.disabled = false;
                piBtn.textContent = '⚡ Conectar com minha conta Pi';
                showBoxFeedback('j-pi-feedback', 'Autorização não concluída. Toque novamente ou continue como visitante.', 'info');
              }
            } catch (err) {
              piBtn.disabled = false;
              piBtn.textContent = '⚡ Conectar com minha conta Pi';
              showBoxFeedback('j-pi-feedback', (err && err.message) ? err.message : 'Falha ao conectar no Pi Browser.', 'error');
            }
          });

          document.getElementById('j-auth-skip').addEventListener('click', function () {
            goToStep(5);
          });
          return;
        }

        // Caso C2: Navegador Web padrão (Google Identity Nativo + Magic Link por E-mail)
        stageEl.innerHTML =
          '<h1 class="j-title">Ative sua conta para comprar ou vender</h1>' +
          '<p class="j-subtitle">Entre com 1 clique via Google ou receba um link mágico no seu e-mail. Leva menos de 15 segundos.</p>' +
          '<div class="j-auth-box">' +
            '<div id="j-google-slot" class="j-google-slot">' +
              '<span style="font-size:0.8rem;color:#a1a1aa">⏳ Carregando login seguro do Google...</span>' +
            '</div>' +
            '<div class="j-divider">ou entre com seu e-mail</div>' +
            '<form id="j-email-form" style="display:flex;flex-direction:column;gap:9px">' +
              '<input id="j-email-input" class="j-input" type="email" autocomplete="email" placeholder="seu@email.com" required />' +
              '<button type="submit" id="j-email-submit" class="j-cta-secondary">✉️ Receber link de acesso no e-mail</button>' +
            '</form>' +
            '<div id="j-web2-feedback" class="j-feedback"></div>' +
          '</div>' +
          '<div class="j-skip-row">' +
            '<button type="button" id="j-auth-skip" class="j-ghost-btn">Continuar sem login por enquanto →</button>' +
          '</div>';

        var googleSlot = document.getElementById('j-google-slot');
        if (window.HokageWeb2Auth && typeof window.HokageWeb2Auth.renderGoogleButton === 'function') {
          window.HokageWeb2Auth.renderGoogleButton(googleSlot, {
            skipAutoRedirect: true,
            onSuccess: function (data, prof) {
              if (prof && prof.username) {
                goToStep(5);
              } else {
                renderCurrentStep();
              }
            },
            onError: function (err) {
              if (googleSlot) {
                googleSlot.innerHTML = '<span style="font-size:0.78rem;color:#a1a1aa;text-align:center">Login Google indisponível neste navegador — use seu e-mail abaixo.</span>';
              }
              if (err && err.message) {
                showBoxFeedback('j-web2-feedback', err.message, 'error');
              }
            }
          }).then(function (ok) {
            if (!ok && googleSlot && googleSlot.textContent.indexOf('Carregando') !== -1) {
              googleSlot.innerHTML = '<span style="font-size:0.78rem;color:#a1a1aa;text-align:center">Use seu e-mail abaixo para entrar com 1 clique.</span>';
            }
          });
        } else if (googleSlot) {
          googleSlot.innerHTML = '<span style="font-size:0.78rem;color:#a1a1aa;text-align:center">Use seu e-mail abaixo para entrar.</span>';
        }

        var emailForm = document.getElementById('j-email-form');
        var emailInput = document.getElementById('j-email-input');
        var emailSubmit = document.getElementById('j-email-submit');
        emailForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          if (!window.HokageWeb2Auth || typeof window.HokageWeb2Auth.sendMagicLink !== 'function') {
            showBoxFeedback('j-web2-feedback', 'Serviço de e-mail indisponível no momento.', 'error');
            return;
          }
          emailSubmit.disabled = true;
          emailSubmit.textContent = '⏳ Enviando link mágico...';
          try {
            var res = await window.HokageWeb2Auth.sendMagicLink(emailInput.value, window.location.origin + '/jornada?step=ready');
            emailSubmit.textContent = '✓ Link enviado!';
            showBoxFeedback('j-web2-feedback', '✓ Enviamos um link de entrada para ' + res.email + '. Abra o link no seu e-mail para voltar já logado!', 'success');
          } catch (err) {
            emailSubmit.disabled = false;
            emailSubmit.textContent = '✉️ Receber link de acesso no e-mail';
            showBoxFeedback('j-web2-feedback', (err && err.message) ? err.message : 'Erro ao enviar e-mail.', 'error');
          }
        });

        document.getElementById('j-auth-skip').addEventListener('click', function () {
          goToStep(5);
        });
      }

      function renderReadyStep() {
        var user = getLoggedUserSnapshot();
        var res = engine.recommendPath(state.answers, user);

        if (!state.analyticsSent) {
          state.analyticsSent = true;
          if (window.HokageAnalyticsTg && typeof window.HokageAnalyticsTg.sendEvent === 'function') {
            window.HokageAnalyticsTg.sendEvent('🧭 Jornada Funil', res.profileLabel, 'intent_' + (state.answers.intent || 'explore'));
          }
        }

        var statusHtml = '';
        if (user && user.username) {
          var handleTxt = '@' + String(user.username).replace(/^@+/, '');
          statusHtml = '<div class="j-status-pill j-status-pill--ok">✓ Logado como ' + esc(handleTxt) + '</div>';
        } else if (user && user.authType === 'web2') {
          statusHtml = '<div class="j-status-pill j-status-pill--ok">✓ Conta conectada' + (user.email ? (' (' + esc(user.email) + ')') : '') + '</div>';
        } else {
          statusHtml = '<div class="j-status-pill j-status-pill--visitor">Modo Visitante (faça login quando quiser)</div>';
        }

        stageEl.innerHTML =
          statusHtml +
          '<h1 class="j-title">' + esc(res.headline) + '</h1>' +
          '<p class="j-subtitle">' + esc(res.subheadline) + '</p>' +
          '<div class="j-ready-actions">' +
            '<a href="' + esc(res.primary.href) + '" class="j-cta-primary">' + esc(res.primary.label) + '</a>' +
            '<a href="' + esc(res.secondary.href) + '" class="j-cta-secondary">' + esc(res.secondary.label) + '</a>' +
          '</div>' +
          '<div class="j-ready-foot">' +
            '<a href="' + esc(res.tertiary.href) + '" class="j-ghost-btn" style="padding-left:0;color:#fbbf24">' + esc(res.tertiary.label) + '</a>' +
            '<button type="button" id="j-restart-btn" class="j-ghost-btn">↺ Refazer jornada</button>' +
          '</div>';

        document.getElementById('j-restart-btn').addEventListener('click', function () {
          state.answers = {};
          state.analyticsSent = false;
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
          goToStep(1);
        });
      }

      function renderCurrentStep() {
        updateHeaderChrome();
        animateStage();
        if (state.step === 1) {
          renderQuestionStep(0);
        } else if (state.step === 2) {
          renderQuestionStep(1);
        } else if (state.step === 3) {
          renderEducationStep();
        } else if (state.step === 4) {
          renderStep4Auth();
        } else {
          renderReadyStep();
        }
      }

      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (state.step > 1) {
            goToStep(state.step - 1);
          }
        });
      }

      window.addEventListener('hokage:web2-auth-ready', function () {
        if (state.step === 4) {
          var u = getLoggedUserSnapshot();
          if (u && u.username) {
            goToStep(5);
          } else {
            renderCurrentStep();
          }
        } else if (state.step === 5) {
          renderCurrentStep();
        }
      });

      loadInitialState();
      renderCurrentStep();
    })();
  </script>
</body>
</html>
